# Port d'écoute standard pour STUN/TURN
listening-port=3478

# Port pour TURN over TLS (optionnel mais recommandé si tu as des certificats valides)
tls-listening-port=5349

# Écoute sur toutes les interfaces
listening-ip=0.0.0.0

# IMPORTANT: Adresse IP publique de ton serveur.
# Les navigateurs l'utiliseront pour se connecter au TURN.
external-ip=192.168.1.92

# Plage de ports UDP pour le relais des médias (doit être ouverte dans le firewall)
min-port=49152
max-port=65535

# Domaine (realm) utilisé pour l'authentification
realm=webrtc.lab

# Authentification par identifiants statiques (simple pour un TP)
lt-cred-mech
user=testuser:Passer123

# Sécurité de base
fingerprint
no-multicast-peers
no-cli

# Logs (utile pour le debug)
log-file=stdout
verbose
