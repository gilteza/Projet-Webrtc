version: "3.9"

services:
  coturn:
    image: coturn/coturn:4.6.2
    container_name: webrtc-coturn
    restart: unless-stopped
    # IMPORTANT: Sur Linux, utiliser network_mode:host est fortement recommandé
    # pour que Coturn voie les vraies IP des clients et gère correctement les ports de relais.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
